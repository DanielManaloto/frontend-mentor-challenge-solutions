<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Age calculator app</title>
  </head>

  <body>
    <main class="age-calculator">
      <form class="age-form">
        <div class="field">
          <label for="day">DAY</label>
          <input
            type="number"
            id="day"
            name="day"
            placeholder="DD"
            min="1"
            max="31"
            required
          />
          <p class="error" id="day-error">---</p>

        </div>
        <div class="field">
          <label for="month">MONTH</label>
          <input
            type="number"
            id="month"
            name="month"
            placeholder="MM"
            min="1"
            max="12"
            required
          />
          <p class="error" id="month-error">---</p>
        </div>

        <div class="field">
          <label for="year">YEAR</label>
          <input
            type="number"
            id="year"
            name="year"
            placeholder="YYYY"
            min="1"
            required
          />
          <p class="error" id="year-error">---</p>
        </div>
      </form>
      <div class="divider">
        <hr />

        <button type="submit" aria-label="Calculate age">
          <img src="./assets/images/icon-arrow.svg" alt="" />
        </button>
      </div>

      <div class="result" aria-live="polite">
        <p>
          <span id="year-result">--</span>
          years
        </p>

        <p>
          <span id="month-result">--</span>
          months
        </p>

        <p>
          <span id="day-result">--</span>
          days
        </p>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge"> Frontend Mentor </a
      >. Coded by <a href="#">Daniel M.</a>.
    </footer>

    <script src="app.js"></script>
  </body>
</html>
