<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Todo app</title>

    <link href="./src/style.css" rel="stylesheet" />
  </head>
  <body
    class="min-h-screen flex flex-col items-center gap-5 font-sans text-lg bg-page-light dark:bg-page-dark max-[375px]:bg-[url('./images/bg-mobile-light.jpg')] dark:max-[375px]:bg-[url('./images/bg-mobile-dark.jpg')] bg-[url('./images/bg-desktop-light.jpg')] dark:bg-[url('./images/bg-desktop-dark.jpg')] bg-no-repeat bg-top transition-colors duration-300"
  >
    <div id="root" class="w-[min(90%,600px)]"></div>

    <footer

    >
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        class="text-brand-blue hover:underline"

    <script type="module" src="./src/main.jsx"></script>
