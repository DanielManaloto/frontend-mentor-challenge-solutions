<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link
    href="assets/fonts/Figtree-Italic-VariableFont_wght.ttf"
    rel="stylesheet"
  />
  <link
    href="assets/fonts/Figtree-VariableFont_wght.ttf"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div id="max-container">
    <div id="main-container">

      <img id="illustration" src="assets/images/illustration-article.svg" alt="illustration article">
      <div id="container-header">
        <p id="category"> Learning </p>

        <p id="published-date"> Published 21 Dec 2023</p>
      </div>


      <h2> HTML & CSS foundations </h2>

      <p id="description"> These languages are the backbone of every website, defining structure, content, and presentation. </p>
      <div id="author-container">
        <img id="author-image" src="assets/images/image-avatar.webp" alt="image of the author">
        <p id="author-name"> Greg Hooper </p> 
      </div>
      
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Daniel M.</a>.
  </footer>
</body>
</html>
